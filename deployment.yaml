apiVersion: apps/v1
kind: Deployment
metadata:
  name: clase6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clase6
  template:
    metadata:
      labels:
        app: clase6
    spec:
      containers:
        - name: clase6
          image: 686333686182.dkr.ecr.us-east-1.amazonaws.com/clase6:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: clase6
spec:
  type: LoadBalancer
  selector:
    app: clase6
  ports:
    - port: 80
      targetPort: 80
